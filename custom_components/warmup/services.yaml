set_override:
  target:
    entity:
      integration: warmup
      domain: climate
  fields:
    temperature:
      required: true
      example: 22.5
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          mode: box
    until:
      example: "14:00"
      selector:
        text:
set_holiday:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: warmup
            model: Location
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    temperature:
      required: true
      example: 10
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          mode: box
cancel_holiday:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: warmup
            model: Location
